{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="muted" style="margin-top:.75rem">{{ message }}</p>
  <p><a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Back to the dashboard</a></p>
</div>
{% endblock %}
